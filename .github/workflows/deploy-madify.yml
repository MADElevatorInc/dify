name: Deploy Madify

# Triggers on deploy/dev pushes or manual dispatch.
# GitHub only needs two repo variables (not secrets) — all real credentials live in AWS Secrets Manager.
#
# One-time GitHub setup (Settings → Variables):
#   AWS_DEPLOY_ROLE_ARN  arn:aws:iam::ACCOUNT_ID:role/madify-deploy-role
#   AWS_REGION           ca-central-1
#
# One-time AWS setup (run once, not in CI):
#   1. IAM OIDC provider: token.actions.githubusercontent.com
#   2. IAM role madify-deploy-role — trust policy below, policy: secretsmanager:GetSecretValue on dify/dev/*
#   3. Secrets Manager secrets (see aws-secrets-template.json)
#   4. EC2 instance with IAM role that allows secretsmanager:GetSecretValue on dify/dev/*
#   5. Route 53 A record: madify.madelevator.com → EC2 elastic IP
#   6. Run scripts/ec2-setup.sh once on the instance
#
# IAM trust policy for madify-deploy-role:
#   {
#     "Version": "2012-10-17",
#     "Statement": [{
#       "Effect": "Allow",
#       "Principal": { "Federated": "arn:aws:iam::ACCOUNT_ID:oidc-provider/token.actions.githubusercontent.com" },
#       "Action": "sts:AssumeRoleWithWebIdentity",
#       "Condition": {
#         "StringEquals": { "token.actions.githubusercontent.com:aud": "sts.amazonaws.com" },
#         "StringLike":   { "token.actions.githubusercontent.com:sub": "repo:MADElevatorInc/dify:*" }
#       }
#     }]
#   }

on:
  push:
    branches: [deploy/dev]
  workflow_dispatch:

permissions:
  id-token: write  # required for OIDC
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch SSH credentials from Secrets Manager
        id: creds
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dify/dev/deploy-config \
            --query SecretString --output text)

          echo "host=$(echo "$SECRET" | python3 -c "import sys,json; print(json.load(sys.stdin)['ssh_host'])")" \
            >> "$GITHUB_OUTPUT"
          echo "user=$(echo "$SECRET" | python3 -c "import sys,json; print(json.load(sys.stdin)['ssh_user'])")" \
            >> "$GITHUB_OUTPUT"

          echo "$SECRET" | python3 -c "import sys,json; print(json.load(sys.stdin)['ssh_private_key'])" \
            > /tmp/deploy.pem
          chmod 600 /tmp/deploy.pem

      - name: Sync docker + scripts to EC2
        run: |
          rsync -az --delete \
            -e "ssh -i /tmp/deploy.pem -o StrictHostKeyChecking=no" \
            docker/ scripts/ \
            "${{ steps.creds.outputs.user }}@${{ steps.creds.outputs.host }}:/opt/dify/"

      - name: Run deploy script on EC2
        run: |
          ssh -i /tmp/deploy.pem \
            -o StrictHostKeyChecking=no \
            "${{ steps.creds.outputs.user }}@${{ steps.creds.outputs.host }}" \
            "bash /opt/dify/scripts/ec2-deploy.sh"

      - name: Cleanup key
        if: always()
        run: rm -f /tmp/deploy.pem
