name: Upstream Dify Sync Check

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-check:
    runs-on: ubuntu-latest
    outputs:
      behind: ${{ steps.check.outputs.behind }}
      branch: ${{ steps.check.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check how far behind upstream we are
        id: check
        run: |
          git remote add upstream https://github.com/langgenius/dify.git
          git fetch upstream main --quiet
          BEHIND=$(git rev-list HEAD..upstream/main --count)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "branch=sync/upstream-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "Upstream is $BEHIND commits ahead"

      - name: Skip if already up to date
        if: steps.check.outputs.behind == '0'
        run: echo "Already up to date with upstream." && exit 0

      - name: Create sync branch and attempt merge
        if: steps.check.outputs.behind != '0'
        id: merge
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          BRANCH="${{ steps.check.outputs.branch }}"
          git checkout -b "$BRANCH"
          # Attempt merge; if conflicts exist, commit the conflict markers so the PR shows them
          if git merge upstream/main --no-edit -m "Sync upstream dify $(date +%Y-%m-%d)"; then
            echo "MERGE_STATUS=clean" >> "$GITHUB_ENV"
          else
            git add -A
            git commit -m "Sync upstream dify $(date +%Y-%m-%d) [CONFLICTS — resolve before merging]"
            echo "MERGE_STATUS=conflicts" >> "$GITHUB_ENV"
          fi
          git push origin "$BRANCH"

      - name: Summarize changes with GitHub Models (Copilot)
        if: steps.check.outputs.behind != '0'
        id: summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the commit log between our HEAD and upstream/main
          LOG=$(git log HEAD~${{ steps.check.outputs.behind }}..upstream/main \
                  --oneline --no-decorate | head -60)

          # Ask GitHub Models to summarize the changes
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "https://models.inference.ai.azure.com/chat/completions" \
            -d "$(jq -n \
              --arg log "$LOG" \
              --arg n "${{ steps.check.outputs.behind }}" \
              '{
                model: "gpt-4o-mini",
                messages: [{
                  role: "user",
                  content: ("You are reviewing " + $n + " new commits from the upstream langgenius/dify repo. Summarize in 3-5 bullet points what changed (new features, breaking changes, notable fixes). Commits:\n" + $log)
                }],
                max_tokens: 400
              }')"
          )

          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "Could not generate summary."')
          # Escape for GitHub output
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Open Pull Request
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass expressions through env — never interpolate step outputs directly into
          # run: shell strings to prevent expression injection via crafted upstream commits.
          BEHIND: ${{ steps.check.outputs.behind }}
          SYNC_BRANCH: ${{ steps.check.outputs.branch }}
          AI_SUMMARY: ${{ steps.summary.outputs.summary }}
        run: |
          CONFLICTS_NOTE=""
          if [ "$MERGE_STATUS" = "conflicts" ]; then
            CONFLICTS_NOTE="

> **Merge conflicts detected** - resolve the conflict markers before merging."
          fi

          # Write body to a file so no shell interpolation of untrusted content occurs.
          printf '## Upstream dify is %s commits ahead of this fork\n\n**Merge status:** %s%s\n\n### What changed (AI summary)\n%s\n\n### Review checklist\n- [ ] Check CHANGELOG or release notes for breaking changes\n- [ ] Check if any new env vars need to be added to `dify/dev/app-config` in Secrets Manager\n- [ ] Test on `deploy/dev` before merging to main\n\n---\n*Auto-generated by the upstream sync workflow. Summarized with GitHub Models.*\n' \
            "$BEHIND" "$MERGE_STATUS" "$CONFLICTS_NOTE" "$AI_SUMMARY" > /tmp/pr-body.md

          gh pr create \
            --title "Sync: upstream dify ($BEHIND commits ahead)" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$SYNC_BRANCH"
